<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitBuddy - Your Plan</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f7f4;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .plan {
            background: #f8faf9;
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 16px;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 12px 20px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        🤖 Hi, {{ name }}! 👋
    </h1>

    <h2>
        Your FitBuddy Fitness Plan
    </h2>

    <div class="plan">
{{ plan }}
    </div>

    <a
        class="back-button"
        href="/"
    >
        Generate Another Plan
    </a>

</div>

</body>

</html>
